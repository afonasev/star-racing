<!doctype html><html lang="ru"><meta charset="utf-8"><title>Star Racing · HUD concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7edf4;font-family:Arial,sans-serif;color:#172b46}header{height:100px;display:flex;align-items:center;gap:32px;padding:0 34px;background:#fff}h1{font-size:21px;margin:0 0 7px}p{margin:0;font-size:12px;color:#6b7c91}.controls{margin-left:auto;display:flex;gap:20px;align-items:center}label{font-size:11px;font-weight:bold;display:flex;flex-direction:column;gap:7px;letter-spacing:1px}select{font:14px Arial;border:1px solid #cfdae6;border-radius:8px;padding:9px;background:#f7f9fc;color:#172b46}#race{height:900px;position:relative;overflow:hidden;background:#adc5dc}.views{position:absolute;inset:0;display:grid;gap:2px;background:#e3edf4}.view{position:relative;overflow:hidden}.scene{position:absolute;width:100%;height:100%}.seatname{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);font-size:11px;letter-spacing:2px;color:white;text-shadow:0 1px 4px #20394d}.hud{position:absolute;width:238px;height:194px;--ink:#193247;--muted:#70879c;color:var(--ink)}.hud.left{left:24px}.hud.right{right:24px}.hud.top{top:18px}.hud.bottom{bottom:16px}.rank{height:38px;display:flex;align-items:center;gap:10px;font-size:24px;font-weight:bold;padding:0 12px}.rank small{font-size:12px;font-weight:normal;color:var(--muted)}.rank i{height:8px;width:8px;background:var(--c);border-radius:50%}.right .rank{justify-content:flex-end}.instrument{height:151px;border:1px solid #fff9;background:#ffffff66;border-radius:24px;box-shadow:0 4px 20px #31506b25;display:flex;align-items:center;gap:10px;padding:10px 14px}.right .instrument{flex-direction:row-reverse}.nitro{height:118px;width:17px;position:relative;border-radius:9px;background:#dfe7ef;border:3px solid white;overflow:hidden}.nitro b{position:absolute;bottom:0;width:100%;height:var(--fill);background:var(--c);border-radius:5px}.nitrolabel{font-size:9px;letter-spacing:1px;margin-top:5px;text-align:center;color:var(--muted)}.dial{width:173px;height:124px;position:relative}.dial svg{width:100%;height:100%}.speed{position:absolute;top:48px;width:100%;text-align:center;font-size:42px;font-weight:bold;letter-spacing:-2px}.speed span{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:0}.time{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#16314b85;color:#fff;border:1px solid #ffffff33;padding:8px 18px;border-radius:20px;font-size:13px;letter-spacing:1px}.progress{position:absolute;bottom:0;height:70px;width:100%;background:#f7fbffed;display:flex;align-items:center;padding:0 32px;gap:22px;box-shadow:0 -1px 0 #ffffffaa}.endpoint{font-size:10px;letter-spacing:1px;color:#718296;font-weight:bold}.rail{position:relative;flex:1;height:36px}.rail:before{content:'';position:absolute;left:0;right:0;top:17px;height:3px;background:#c2d0de;border-radius:3px}.rail .tick{position:absolute;top:15px;width:1px;height:7px;background:#92a7b8}.dot{position:absolute;top:18px;transform:translate(-50%,-50%);border-radius:50%;width:8px;height:8px;border:1px solid #fff9;background:var(--dot)}.dot.human{width:23px;height:23px;border:3px solid white;color:white;text-align:center;font:bold 10px/17px Arial;box-shadow:0 1px 5px #26485b50;z-index:3}.dark .hud{--ink:#f7fcff;--muted:#a5bbca}.dark .instrument{background:#0b1e2aea;border-color:#82a0b840;border-radius:14px;box-shadow:0 8px 28px #0b1b3040}.dark .nitro{background:#2d414f;border:0;width:12px;border-radius:3px}.dark .nitro b{border-radius:2px}.digital{width:178px;height:118px;padding:9px 6px}.digital .speed{position:static;text-align:left;font-size:60px;line-height:62px}.digital .speed span{font-size:10px;line-height:20px;margin-top:2px}.stripes{height:12px;display:flex;gap:4px;margin-top:6px}.stripes b{width:10px;background:#35515f;transform:skew(-15deg);border-radius:1px}.stripes b.on{background:var(--c)}.dark .rank{background:#0b1e2adb;border-radius:7px;width:max-content;margin-bottom:5px}.dark .right .rank{margin-left:auto}.dark .bottom .rank{margin-top:5px;margin-bottom:0}.dark .progress{background:#0b1e2af5;box-shadow:0 -1px 0 #496171}.dark .rail:before{background:#496171}.dark .endpoint{color:#bdcbd5}.dark .rail .tick{background:#7e95a3}.dark .dot.human{border-color:#d6edf8}.empty{display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#e4eef8,#c3d9ed)}.empty div{font-size:24px;letter-spacing:5px;font-weight:bold;color:#739bb9}.empty small{display:block;font-size:11px;letter-spacing:2px;text-align:center;margin-top:14px}.dark .rank small{color:#a5bbca}

/* Selected Cloudline revision: compact instruments and floating common rail. */
.hud{width:164px;height:104px}.instrument{height:104px;border-radius:18px;padding:8px 10px;gap:6px}.dial{width:120px;height:86px}.speed{top:32px;font-size:30px;letter-spacing:-1px}.speed span{font-size:9px;letter-spacing:1px}.nitro{height:76px;width:12px;border-width:2px}.nitrolabel{font-size:8px;margin-top:3px}.position{position:absolute;--muted:#70879c}.position.left{left:12px}.position.right{right:12px}.position.top{top:18px}.position.bottom{bottom:18px}.rank{height:40px;background:#f9fcffeb;border:1px solid #fff9;border-radius:12px;box-shadow:0 3px 12px #31506b20;padding:0 13px}.position.right .rank{justify-content:flex-end}.progress{left:20%;width:60%;bottom:18px;height:26px;border-radius:0;background:transparent;border:0;padding:0 18px;gap:14px;box-shadow:none}.seatname{display:none}#race[data-seats="2"] .time{top:72px}
.rail{height:24px}.rail:before{top:11px;height:2px;background:#e8f4ffb3;box-shadow:0 1px 3px #19324755}.rail .tick{top:9px;height:6px;background:#e8f4ff99}.dot{top:12px;width:6px;height:6px}.dot.human{width:18px;height:18px;border-width:2px;font-size:9px;line-height:14px}.endpoint{color:#eaf5ff;text-shadow:0 1px 3px #193247}
</style>
<header><div><h1 id="title">Cloudline · компактный HUD</h1><p>HUD-макет · условная сцена, не скриншот игры · одна полоса на всю гонку</p></div><div class="controls"><label>ДИЗАЙН<select id="style"><option value="light">1 — Cloudline</option></select></label><label>ЛОКАЛЬНЫЕ ИГРОКИ<select id="seats"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label>УЧАСТНИКИ<select id="entrants"><option>8</option><option>16</option><option>32</option><option selected>64</option></select></label></div></header><main id="race"></main>
<script>
const colors=['#1966ff','#f05c1f','#009eaf','#7b3bea'];const progress=[.79,.66,.48,.35];const speeds=[218,204,196,211];const ranks=[1,8,23,36];
function scene(i){return `<svg class="scene" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky${i}" x2="0" y2="1"><stop stop-color="#85b5d8"/><stop offset="1" stop-color="#e0edf5"/></linearGradient><linearGradient id="road${i}" x2="0" y2="1"><stop stop-color="#65839a"/><stop offset="1" stop-color="#243f52"/></linearGradient></defs><rect width="800" height="500" fill="url(#sky${i})"/><circle cx="640" cy="100" r="56" fill="#ffffff60"/><path d="M0 230 Q120 195 210 235 T410 228 T620 210 T850 240 V500H0Z" fill="#dce9f0"/><g fill="#b3cbdc"><path d="M15 260v-65h47v-24h22v89zM112 260v-94h55v94zM180 260v-140h38v140zM600 260v-114h49v114zM670 260v-71h53v71zM741 260v-150h40v150z"/></g><path d="M345 218 Q410 255 400 310 L780 500 H0 L299 310 Q320 260 345 218" fill="url(#road${i})"/><path d="M345 218 Q320 265 299 310 L0 500M349 218 Q410 255 400 310 L780 500" fill="none" stroke="#c3ebf7" stroke-width="7"/><path d="M347 223L346 242M345 256L344 277M343 296L347 325M352 353L370 393M382 420L416 480" stroke="#effaff99" stroke-width="5"/><path d="M0 446L260 286M550 350L780 470" stroke="#e0f4ff44" stroke-width="2"/><g transform="translate(382 386)"><ellipse cx="0" cy="20" rx="55" ry="16" fill="#132b4655"/><path d="M-46 23L-42-11-27-30H24L43-10 47 23Z" fill="${colors[i]}" stroke="#e0f5ff" stroke-width="2"/><path d="M-25-25H22L32-9H-32Z" fill="#1c3c54"/><path d="M-43 8H44V22H-43Z" fill="#17374c"/><path d="M-38 10H-17M17 10H38" stroke="#ffd4ab" stroke-width="4"/><path d="M-21 23l-8 28M21 23l8 28" stroke="#96eaff" stroke-width="5" opacity=".75"/></g><g transform="translate(342 284) scale(.32)"><path d="M-40 20L-35-10-22-25H22L35-10 40 20Z" fill="${colors[(i+1)%4]}"/><path d="M-20-20H20L29-5H-29Z" fill="#21445b"/></g></svg>`}
function instrument(i,dark){const n=`<div><div class="nitro" style="--fill:${[76,48,92,31][i]}%"><b></b></div><div class="nitrolabel">N₂</div></div>`;let dial=dark?`<div class="digital"><div class="speed">${speeds[i]}<span>КМ/Ч</span></div><div class="stripes">${Array.from({length:12},(_,j)=>`<b class="${j<9?'on':''}"></b>`).join('')}</div></div>`:`<div class="dial"><svg viewBox="0 -8 180 140"><path d="M20 94 A72 72 0 1 1 160 94" stroke="#dbe5ee" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M20 94 A72 72 0 1 1 160 94" stroke="${colors[i]}" stroke-width="7" fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="78 100"/><g fill="#8199ac" font-size="9"><text x="12" y="111">0</text><text x="79" y="12">150</text><text x="149" y="111">300</text></g></svg><div class="speed">${speeds[i]}<span>КМ/Ч</span></div></div>`;return `<div class="instrument">${n}${dial}</div>`}
function render(){const count=+seats.value,total=+entrants.value,dark=style.value==='dark';document.getElementById('title').textContent=dark?'02 · Telemetry / компактный':'Cloudline · компактный HUD';race.className=dark?'dark':'';race.dataset.seats=count;let html=`<div class="views" style="grid-template-columns:repeat(${count===1?1:2},1fr);grid-template-rows:repeat(${count<=2?1:2},1fr)">`;for(let i=0;i<(count===3?4:count);i++){if(i===3&&count===3){html+='<div class="view empty"><div>STAR RACING<small>ОБЩАЯ ГОНКА</small></div></div>';continue}let top=count>2&&i<2,right=count>1&&i%2===1;let rank=`<div class="rank"><i></i>${(1+Array.from({length:total-count},(_,j)=>.025+.737*Math.pow(j/Math.max(1,total-count-1),.82)).filter(p=>p>progress[i]).length+progress.slice(0,count).filter(p=>p>progress[i]).length)}<small>/ ${total}</small></div>`;html+=`<div class="view">${scene(i)}<div class="seatname">ИГРОК ${i+1}</div><div class="hud ${top?'top':'bottom'} ${right?'right':'left'}" style="--c:${colors[i]}">${instrument(i,dark)}</div><div class="position ${top?'bottom':'top'} ${right?'right':'left'}" style="--c:${colors[i]}">${rank}</div></div>`}html+='</div><div class="time">01:42.38</div><div class="progress"><span class="endpoint">СТАРТ</span><div class="rail">';for(let j=0;j<=10;j++)html+=`<span class="tick" style="left:${j*10}%"></span>`;let markers=[];for(let j=0;j<total-count;j++){let p=.025+.737*Math.pow(j/Math.max(1,total-count-1),.82);markers.push({p,c:`hsl(${(j*137.5)%360} 44% ${dark?'66':'52'}%)`,h:false})}for(let i=0;i<count;i++)markers.push({p:progress[i],c:colors[i],h:true,i});markers.sort((a,b)=>a.h-b.h);for(const m of markers)html+=`<span class="dot ${m.h?'human':''}" style="left:${m.p*100}%;--dot:${m.c}" title="${m.h?'Игрок '+(m.i+1):'AI'} · ${Math.round(m.p*100)}%">${m.h?m.i+1:''}</span>`;race.innerHTML=html+'</div><span class="endpoint">ФИНИШ ⚑</span></div>';}
const seats=document.getElementById('seats'),entrants=document.getElementById('entrants'),style=document.getElementById('style'),race=document.getElementById('race');[seats,entrants,style].forEach(e=>e.onchange=render);render();
</script></html>
