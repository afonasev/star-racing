<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Racing — HUD studies</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#e9edf3;background:#11151e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,select{font:inherit}header{padding:28px 40px 24px;display:flex;gap:30px;align-items:center;border-bottom:1px solid #ffffff15}header h1{font-size:23px;margin:0 0 8px;font-weight:650;letter-spacing:-.5px}header p{color:#98a4b7;font-size:13px;margin:0}.controls{display:flex;gap:14px;margin-left:auto}label{display:grid;gap:6px;color:#8c9ab0;font-size:10px;letter-spacing:1px}select{color:#e9edf3;background:#1b2330;border:1px solid #354052;padding:8px 10px;border-radius:6px;font-size:12px}main{padding:24px 40px 40px;max-width:1680px;margin:auto}.concept{margin-bottom:34px}.intro{display:flex;align-items:center;margin-bottom:15px;gap:18px}.num{font-size:12px;color:#a1b0c6;border:1px solid #394253;width:35px;height:35px;display:grid;place-items:center;border-radius:50%}.intro h2{font-size:21px;letter-spacing:-.5px;margin:0 0 5px}.intro p{color:#99a5b7;font-size:12px;margin:0}.tag{margin-left:auto;color:#becde0;font-size:10px;letter-spacing:1px;border:1px solid #384253;padding:8px 12px;border-radius:20px}.race{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#172536;border-radius:10px;border:1px solid #ffffff25;isolation:isolate}.views{position:absolute;inset:0;display:grid;gap:2px;background:#121925}.view{position:relative;overflow:hidden}.back{width:100%;height:100%;position:absolute;inset:0}.empty{display:grid;place-content:center;background:radial-gradient(ellipse at 50% 100%,#263955,#111823);text-align:center;letter-spacing:6px;font-size:25px}.empty small{font-size:10px;letter-spacing:2px;color:#8193ad;margin-top:15px}.clock{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:650;letter-spacing:1px;padding:7px 15px;background:#101825da;border:1px solid #ffffff21;border-radius:20px;color:#eef4fb}.clock:before{content:'◷';padding-right:8px;opacity:.5}.unit{position:absolute;left:16px;bottom:18px;--c:#59a8ff}.right .unit{left:auto;right:16px}.top .unit{bottom:auto;top:16px}.unit .player{font-size:9px;letter-spacing:1.4px;font-weight:750;display:flex;align-items:center;gap:7px}.player i{width:6px;height:6px;border-radius:50%;background:var(--c);display:inline-block}.rank{display:flex;align-items:baseline;gap:3px}.rank strong{font-size:27px;font-weight:750;line-height:1}.rank small{font-size:11px;opacity:.55}.speed strong{font-size:45px;line-height:1;font-weight:650;letter-spacing:-2px;font-variant-numeric:tabular-nums}.speed small{display:block;font-size:8px;letter-spacing:1.4px;margin-top:4px;opacity:.6}.nitro-label{font-size:8px;font-weight:650;letter-spacing:1px}.nitro-track{background:#95a4b73b;position:relative;overflow:hidden}.nitro-track b{display:block;background:var(--c)}.rail{position:absolute;bottom:15px;left:24%;width:52%;height:29px;filter:drop-shadow(0 1px 2px #000)}.track{position:absolute;top:17px;left:0;right:0;height:2px;background:#e5f2ff72}.endpoint{position:absolute;top:14px;font-size:8px;color:#fff;letter-spacing:1px;font-weight:650}.start{right:calc(100% + 12px)}.finish{left:calc(100% + 12px)}.marker{position:absolute;top:18px;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:var(--mc);opacity:.55}.marker.human{z-index:3;width:21px;height:21px;border:2px solid white;opacity:1;color:#091624;font-size:10px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px #09162470}.rail .label{position:absolute;bottom:22px;font-size:8px;color:#e9f3ff;letter-spacing:1px;right:0}.footer{display:flex;gap:30px;padding:14px 0 0;color:#8e9eb5;font-size:11px;line-height:1.6}.footer b{color:#d7e2f1;font-weight:550}.cloud .unit{width:187px;height:105px;border:1px solid #ffffffab;border-radius:15px;background:#f4f8f1f0;color:#142d43;box-shadow:0 4px 14px #08152733;padding:12px 14px;border-left:3px solid var(--c)}.cloud .player{color:#5b7082}.cloud .rank{position:absolute;right:15px;top:13px}.cloud .rank strong{font-size:23px}.cloud .speed{margin-top:9px}.cloud .nitro-track{position:absolute;right:17px;bottom:12px;width:5px;height:43px;border-radius:5px}.cloud .nitro-track b{position:absolute;bottom:0;width:100%;height:var(--fill)}.cloud .nitro-label{position:absolute;right:31px;bottom:12px;color:#668093}.cloud .speed strong{font-size:42px}.apex .unit{width:216px;height:95px;padding:12px 15px;background:linear-gradient(110deg,#0b1724f5,#152235ee);color:#f3f7ff;border:1px solid #8daecc47;clip-path:polygon(0 0,100% 0,100% 78%,90% 100%,0 100%);border-left:3px solid var(--c)}.apex .player{color:#9aaec7}.apex .speed{position:absolute;left:15px;top:32px}.apex .speed strong{font-size:40px;font-weight:750;font-style:italic}.apex .speed small{display:inline;padding-left:7px;font-size:8px;letter-spacing:.6px}.apex .rank{position:absolute;right:17px;top:16px}.apex .rank strong{color:var(--c);font-size:31px}.apex .nitro-track{position:absolute;bottom:12px;left:15px;width:145px;height:4px;transform:skewX(-18deg)}.apex .nitro-track b{width:var(--fill);height:100%}.apex .nitro-label{position:absolute;bottom:10px;right:25px;color:#c4d3e6;font-size:8px}.edge .unit{width:171px;height:95px;color:white;padding:10px 12px;border-left:2px solid var(--c);background:linear-gradient(90deg,#071423e0,#07142385 75%,#07142300);text-shadow:0 1px 2px #061528}.edge .player{opacity:.72}.edge .speed{margin-top:10px}.edge .speed strong{font-size:46px;font-weight:600}.edge .speed small{display:inline;font-size:8px;padding-left:6px;letter-spacing:.4px}.edge .rank{position:absolute;right:14px;top:12px}.edge .rank strong{font-size:22px}.edge .rank small{font-size:9px}.edge .nitro-track{height:3px;width:107px;margin-top:7px;background:#b2c7df44}.edge .nitro-track b{height:100%;width:var(--fill)}.edge .nitro-label{position:absolute;right:15px;bottom:13px;color:#d2dfec;font-size:8px}.edge .clock{background:#0c172490}.edge .marker:not(.human){opacity:.4}.shot header{display:none}.shot main{padding:26px 32px 12px;max-width:none}.shot .concept{margin:0}.shot .intro{margin-bottom:17px}.shot .intro h2{font-size:24px}.shot .intro p{font-size:13px}.shot .race{border-radius:7px}.shot .footer{font-size:12px}.shot .note{font-size:10px;color:#8090a7;padding-top:12px}.note{color:#8090a7;font-size:11px}.race[data-seats="1"] .unit{transform:scale(1.15);transform-origin:bottom left;bottom:26px;left:25px}.race[data-seats="2"] .clock{top:10px}.race[data-seats="1"] .rail{left:23%;width:54%}
@media(max-width:850px){header{padding:20px;flex-wrap:wrap}.controls{margin:0}main{padding:20px}.intro p{max-width:400px}.unit{transform:scale(.7);transform-origin:bottom left}.right .unit{transform-origin:bottom right}.top .unit{transform-origin:top left}.top.right .unit{transform-origin:top right}.tag{display:none}}

/* Edge revision selected for refinement: small instruments, inner top standing. */
.edge .unit{width:108px;height:54px;padding:7px 9px;border-left-width:1px}
.edge .view.right .unit{border-left:0;border-right:1px solid var(--c);background:linear-gradient(270deg,#071423e0,#07142385 75%,#07142300)}
.edge .speed{margin-top:0}.edge .speed strong{font-size:28px;letter-spacing:-1px}
.edge .speed small{font-size:6px;padding-left:4px}
.edge .nitro-track{width:68px;height:2px;margin-top:5px}
.edge .nitro-label{right:10px;bottom:7px;font-size:6px}
.edge .standing{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:6px;color:#fff;padding:4px 7px;background:#071423a8;border-radius:4px;text-shadow:0 1px 2px #061528}
.edge .view.right .standing{right:auto;left:14px}
.edge .standing i{width:4px;height:4px;background:var(--c);border-radius:50%}
.edge .standing .rank{position:static;gap:2px}.edge .standing .rank strong{font-size:18px}.edge .standing .rank small{font-size:8px}
.edge .race[data-seats="1"] .unit{transform:none;left:16px;bottom:18px}
.edge .rail{height:18px;bottom:10px}.edge .track{top:9px;height:1px}
.edge .marker{top:10px;width:3px;height:3px}.edge .marker.human{width:14px;height:14px;border-width:1px;font-size:7px;box-shadow:0 0 0 1px #09162470}
.edge .endpoint{top:7px;font-size:6px;letter-spacing:.5px}
</style></head><body>
<header><div><h1>Star Racing / HUD concepts</h1><p>Три направления · реальные игровые фоны из сохранённой QA · дизайн-макеты</p></div><div class="controls"><label>ИГРОКИ<select id="seats"><option>1</option><option>2</option><option>3</option><option selected>4</option></select></label><label>УЧАСТНИКИ<select id="entrants"><option>8</option><option>16</option><option>32</option><option selected>64</option></select></label><label>ТРАССА<select id="theme"><option value="space">Космос / тёмная</option><option value="cloud">Облака / светлая</option></select></label></div></header><main id="main"></main>
<script>
const colors=['#59a8ff','#ffab68','#37d2d9','#bb8cff'],speeds=[218,211,204,197],fills=[76,61,43,28],progress=[.78,.67,.53,.38];
const concepts=[{id:'cloud',name:'Cloudline / собранный и светлый',desc:'Спокойная карточка · место и скорость рядом · вертикальное нитро',tag:'ПРЕЕМСТВЕННОСТЬ',plus:'Самый близкий к стилю меню; уверенный контраст на обеих трассах.',trade:'Карточка заметнее; это вариант с сохранением светлого характера HUD.'},{id:'apex',name:'Apex / спортивная телеметрия',desc:'Крупные цифры · тёмная опора · заряд нитро под скоростью',tag:'РЕКОМЕНДУЮ',plus:'Место, скорость и нитро читаются одним взглядом; сильная иерархия.',trade:'Меняет светлый стиль и вертикальное нитро; подложка чуть шире.'},{id:'edge',name:'Edge / максимум трассы',desc:'Маленькая скорость · место у центра сверху · без имени и таймера',tag:'МИНИМАЛИЗМ',plus:'Прибор меньше на 64% по площади; место вынесено к центру, трасса открыта.',trade:'На пёстром фоне цифрам нужна более сильная локальная тень.'}];
const query=new URLSearchParams(location.search);if(query.has('seats'))document.querySelector('#seats').value=query.get('seats');if(query.has('theme'))document.querySelector('#theme').value=query.get('theme');if(query.has('shot'))document.body.classList.add('shot');
function background(i,n,theme){let box=theme==='cloud'?'115 82 1490 720':`${i%2?914:50} ${i>1?545:137} 725 273`;return `<svg class="back" viewBox="${box}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><image href="source-${theme}.png" width="1728" height="950"/></svg>`}
function unit(i,n,total,id){let place=[1,13,25,64][i];place=Math.min(total,Math.max(i+1,Math.round(place*total/64)));const rank=`<div class="rank"><strong>${place}</strong><small>/ ${total}</small></div>`;const standing=id==='edge'?`<div class="standing" style="--c:${colors[i]}"><i></i>${rank}</div>`:'';return standing+`<div class="unit" style="--c:${colors[i]};--fill:${fills[i]}%">${id==='edge'?'':`<div class="player"><i></i>ИГРОК ${i+1}</div>${rank}`}<div class="speed"><strong>${speeds[i]}</strong><small>КМ/Ч</small></div><div class="nitro-track"><b></b></div><div class="nitro-label">N₂</div></div>`}
function rail(n,total){let h='<div class="rail"><div class="track"></div><span class="endpoint start">СТАРТ</span><span class="endpoint finish">ФИНИШ ⚑</span>';for(let j=0;j<total-n;j++){let p=.04+.70*Math.pow(j/Math.max(1,total-n-1),.85);h+=`<i class="marker" title="AI ${j+1}" style="left:${p*100}%;--mc:hsl(${j*137.5%360} 40% 85%)"></i>`}for(let i=0;i<n;i++)h+=`<span class="marker human" style="left:${progress[i]*100}%;--mc:${colors[i]}">${i+1}</span>`;return h+'</div>'}
function render(){let n=+document.querySelector('#seats').value,total=+document.querySelector('#entrants').value,theme=document.querySelector('#theme').value;document.querySelector('#main').innerHTML=concepts.filter(c=>!query.has('shot')||query.get('shot')===c.id).map((c,k)=>{let h=`<section class="concept ${c.id}"><div class="intro"><span class="num">0${concepts.indexOf(c)+1}</span><div><h2>${c.name}</h2><p>${c.desc}</p></div><span class="tag">${c.tag}</span></div><div class="race" data-seats="${n}"><div class="views" style="grid-template-columns:repeat(${n===1?1:2},1fr);grid-template-rows:repeat(${n>2?2:1},1fr)">`;for(let i=0;i<(n===3?4:n);i++){if(n===3&&i===3){h+='<div class="view empty">STAR RACING<small>ОБЩАЯ ГОНКА</small></div>';continue}h+=`<div class="view ${i%2&&n>1?'right':''} ${n>2&&i<2?'top':''}">${background(i,n,theme)}${unit(i,n,total,c.id)}</div>`}h+=`</div>${c.id==='edge'?'':'<div class="clock">01:42</div>'}${rail(n,total)}</div><div class="footer"><span><b>Преимущество:</b> ${c.plus}</span><span><b>Компромисс:</b> ${c.trade}</span></div></section>`;return h}).join('')+'<p class="note">КОНЦЕПТ, НЕ ИГРОВОЙ СКРИНШОТ · фон — кадр QA от 8 октября, с кадрированием · значения HUD условные · одна общая полоса, все '+total+' участников</p>'}
for(const s of document.querySelectorAll('select'))s.onchange=render;render();
</script></body></html>
