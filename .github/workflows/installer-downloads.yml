name: Installer download links

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'README*'
      - 'SOURCE_REVISION'
      - 'source-snapshot.json'
      - '.github/scripts/installer_downloads.py'
      - '.github/workflows/installer-downloads.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: Update installer links (false performs a read-only audit)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: installer-download-links-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository_owner == 'afonasev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check updater contracts
        run: python3 -m unittest discover -s .github/scripts -p test_installer_downloads.py
      - name: Refresh installer download links
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INSTALLER_LINKS_APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
        run: python3 .github/scripts/installer_downloads.py
